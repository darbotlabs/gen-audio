[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-audio"
version = "0.1.0"
description = "GenAID Audio toolkit: multi-speaker podcast synthesis, a 24 kHz publish chain, spectrograms, and a cube-revision sketch."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "Darbot Labs" }]
keywords = ["audio", "tts", "podcast", "kokoro", "genaid"]
classifiers = [
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
kokoro = [
    "kokoro-onnx>=0.4.9",
    "onnxruntime>=1.16",
]
dev = [
    "pytest>=8",
]
# VibeVoice-1.5B inference runtime (VibeVoice-community @ 952326d, which is
# located by env/config and never vendored). Inference only: datasets, gradio,
# peft, ml-collections, absl-py, av and aiortc from upstream's pyproject are
# fine-tuning / demo-UI deps and are deliberately left out. torch comes from
# the PyTorch CPU index (see [tool.uv.sources]); every package must install
# from a cp314 (or pure/abi3) wheel, never an sdist (see [tool.uv]).
vibevoice = [
    "torch==2.14.1",
    "transformers==4.51.3",
    "accelerate==1.6.0",
    "diffusers==0.39.0",
    "librosa>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/darbotlabs/gen-audio"
Documentation = "https://github.com/darbotlabs/gen-audio/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/darbotlabs/gen-audio/issues"

[project.scripts]
gen-audio-synth = "gen_audio.cli.synth:main"
gen-audio-improve = "gen_audio.cli.improve:main"
gen-audio-spectrogram = "gen_audio.cli.spectrogram:main"
gen-audio-cube = "gen_audio.cli.cube:main"
gen-audio-spectrogram-strip = "gen_audio.cli.spectrogram_strip:main"
gen-audio-compare = "gen_audio.cli.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Lock only for the hosts we ship to (box/CI linux x86_64, SMAX win AMD64), and
# fail the lock if either one would need anything but a wheel.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# Wheels only for every dependency; the gen-audio project itself is still
# built (editable) from this checkout.
no-build = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
