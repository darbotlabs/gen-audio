[package]
name = "gen-audio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Shared Gen-Audio types: engines, serve URLs, card viewport checks, fixture tones, and the Python CLI bridge."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
unicode-normalization = "0.1"

[features]
# NoKokoroEnv and KOKORO_ENV (bridge.rs) for other crates' tests. Enabled only
# from [dev-dependencies]; never in a normal or release build.
test-support = []

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
