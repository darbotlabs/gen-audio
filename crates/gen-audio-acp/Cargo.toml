[package]
name = "gen-audio-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Agent Client Protocol agent for Gen-Audio."

[[bin]]
name = "gen-audio-acp"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
gen-audio-connectors = { workspace = true }
gen-audio-core = { workspace = true }
gen-audio-mcp = { path = "../gen-audio-mcp" }

[dev-dependencies]
# Tests use gen_audio_core::bridge::NoKokoroEnv (feature test-support).
gen-audio-core = { workspace = true, features = ["test-support"] }
