name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: libsndfile
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - run: cargo test --workspace --exclude gen-audio-desktop
      - name: Stage MCP sidecar so desktop config can see externalBin
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/debug/gen-audio-mcp" "apps/desktop/src-tauri/binaries/gen-audio-mcp-${triple}"
      - run: cargo check -p gen-audio-desktop

  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Asset object golden vectors + Ajv2020 (shared with cargo test)
        run: npm test
      - run: npm run build

  windows-scripts:
    # PSScriptAnalyzer (pinned 1.24.0, any finding fails), the script-sprawl
    # gate and the regen check (asset_vectors -> v1.json must match; the
    # library WAVs are gitignored, so build_assets reports SKIPPED here),
    # under both PowerShell 7 and Windows PowerShell 5.1.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer 1.24.0 (pwsh)
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: Install PSScriptAnalyzer 1.24.0 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: PSSA + sprawl gate + regen (pwsh 7)
        shell: pwsh
        run: ./scripts/test.ps1 -Tag ci-pwsh -Skip Cargo,Npm,Python
      - name: PSSA + sprawl gate + regen (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test.ps1 -Tag ci-winps -Skip Cargo,Npm,Python
