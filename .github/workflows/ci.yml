name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Cube identity is generator_sha256 and needs no history; full
          # history only lets tests/test_cube_layers.py check that each
          # informational manifest generator_commit holds those bytes.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: libsndfile
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Regen gate (manifest cube mirror, synth sidecar paths)
        run: |
          python scripts/cube_revision.py manifest
          git diff --exit-code -- apps/desktop/public/library/manifest.json 'apps/desktop/public/library/*.synth.json'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - run: cargo test --workspace --exclude gen-audio-desktop
      # PR #5 verification E2. The library WAVs are gitignored, so CI takes
      # their identity from schemas/asset-object/media.lock.json; build_assets
      # fails (never skips) when a WAV is neither on disk nor locked, or when a
      # cube JSON's source_sha256 is not its clip's WAV.
      - name: Regen gate (asset catalog, vectors)
        run: |
          cargo run -p gen-audio-core --example build_assets -- --from-lock
          cargo run -p gen-audio-core --example asset_vectors
          git diff --exit-code -- apps/desktop/public/library schemas
      # `cargo test` builds gen-audio-mcp's test harness, not the binary, so
      # target/debug/gen-audio-mcp does not exist until it is built here (debug
      # profile, the path the cp below reads).
      - name: Build MCP sidecar binary (debug)
        run: cargo build -p gen-audio-mcp
      - name: Stage MCP sidecar so desktop config can see externalBin
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/debug/gen-audio-mcp" "apps/desktop/src-tauri/binaries/gen-audio-mcp-${triple}"
      - run: cargo check -p gen-audio-desktop

  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Asset object golden vectors + Ajv2020 (shared with cargo test)
        run: npm test
      - run: npm run build
