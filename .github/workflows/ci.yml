name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_cube_layers.py checks each cube's generator_commit
          # against git log -1 on src/gen_audio/cube_layers.py.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: libsndfile
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Regen gate (manifest cube mirror)
        run: |
          python scripts/cube_revision.py manifest
          git diff --exit-code -- apps/desktop/public/library/manifest.json

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - run: cargo test --workspace --exclude gen-audio-desktop
      # PR #5 verification E2. The library WAVs are gitignored, so CI takes
      # their identity from schemas/asset-object/media.lock.json; build_assets
      # fails (never skips) when a WAV is neither on disk nor locked, or when a
      # cube JSON's source_sha256 is not its clip's WAV.
      - name: Regen gate (asset catalog, vectors)
        run: |
          cargo run -p gen-audio-core --example build_assets -- --from-lock
          cargo run -p gen-audio-core --example asset_vectors
          git diff --exit-code -- apps/desktop/public/library schemas
      - name: Stage MCP sidecar so desktop config can see externalBin
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/debug/gen-audio-mcp" "apps/desktop/src-tauri/binaries/gen-audio-mcp-${triple}"
      - run: cargo check -p gen-audio-desktop

  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Asset object golden vectors + Ajv2020 (shared with cargo test)
        run: npm test
      - run: npm run build

  windows-scripts:
    # PSScriptAnalyzer (pinned 1.24.0, any finding fails), the script-sprawl
    # gate and the regen check (build_assets -FromLock: the library WAVs are
    # gitignored, so their identity comes from media.lock.json; then
    # asset_vectors, the manifest cube mirror and git diff --exit-code),
    # under both PowerShell 7 and Windows PowerShell 5.1.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer 1.24.0 (pwsh)
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: Install PSScriptAnalyzer 1.24.0 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: PSSA + sprawl gate + regen (pwsh 7)
        shell: pwsh
        run: ./scripts/test.ps1 -Tag ci-pwsh -FromLock -Skip Cargo,Npm,Python
      - name: PSSA + sprawl gate + regen (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test.ps1 -Tag ci-winps -FromLock -Skip Cargo,Npm,Python
